# Any property can be overridden with a JVM system property, e.g. -Dplatform=ios

# android | ios
platform=android

# Appium server, started by the tests (see AppiumServer)
appium.host=127.0.0.1
appium.port=4723

# Session capabilities (app, emulator, timeouts) are in capabilities/<platform>.json

# Stop the Android emulator after the tests, so every run starts on a freshly booted one.
# false in CI, where the emulator is managed by the workflow.
android.emulator.shutdown=true

# Waits
timeout.seconds=15
polling.millis=250

# Retry of failed tests: 0 (disabled) or 1; CI uses 1
retry.count=0
