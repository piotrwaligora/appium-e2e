name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 5 * * *'   # 05:47 UTC; off the full hour, when GitHub drops fewer scheduled runs
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  android:
    name: Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The emulator needs hardware acceleration; without KVM it is too slow to run tests.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Node runs the Appium server (started by the tests) and the Allure report generator.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@4.0.1
          appium driver install uiautomator2@10.4.0

      - name: Download the app under test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-apps.ps1

      # The AVD has the same name as locally, so appium:avd in android.json finds the running emulator.
      # The emulator is managed here, so the tests do not stop it; one retry absorbs emulator hiccups.
      - name: Run tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_8
          avd-name: Pixel_API_36
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: mvn -B test -Dretry.count=1 -Dandroid.emulator.shutdown=false

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Add report link to the run summary
        if: always()
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest report from \`main\`: ${{ env.REPORT_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report of this run: download the \`allure-report\` artifact below" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report for GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 14

      # Screenshots and page sources are attached only to failed test attempts
      - name: Upload failure screenshots and page sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failures
          path: |
            target/allure-results/*.png
            target/allure-results/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            target/appium.log
            target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

  # Publishes the Allure report of main (merge, schedule or manual run) to GitHub Pages, also when tests fail.
  publish-report:
    name: Publish Allure report
    needs: android
    if: always() && needs.android.result != 'cancelled' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
